<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الجمعية</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--rule:rgba(36,71,168,.07);--card:#fff;--tx:#14213d;--mu:#5a6785;--ac:#2447a8;--acs:#e6ecfb;--ok:#1f7a4d;--oks:#e2f3ea;--hl:#fff0a8;--gold:#c9a100;--bd:#d3dae8;--red:#c1272d;--reds:#fbe9ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--rule:rgba(255,255,255,.04);--card:#171e2e;--tx:#e8ecf5;--mu:#93a0bd;--ac:#8cabff;--acs:#1b2a52;--ok:#4cc38a;--oks:#173528;--hl:#4a3f12;--gold:#e0b93a;--bd:#2a3550;--red:#ff7a7f;--reds:#3a1a1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
.hero{padding:calc(26px + env(safe-area-inset-top,0px)) 0 10px;margin-bottom:20px}
.hin{max-width:980px;margin:0 auto;padding:0 14px 12px;border-bottom:3px double var(--tx)}
.hero h1{font-family:"Aref Ruqaa","Amiri",serif;font-size:2.5rem;font-weight:700;margin:0;line-height:1.5}
.hero p{margin:0;color:var(--mu)}
.hb{background:transparent;color:var(--ac);border:0;padding:0;margin-bottom:2px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.ct{max-width:980px;margin:0 auto;padding:0 14px 48px}
h2{font-size:1.05rem;font-weight:600;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mu);gap:3px;flex:1;min-width:130px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 11px;width:100%}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:8px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:600}
button.g{padding:2px 8px;color:var(--mu)}
.d{color:var(--red)}
.stats{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-bottom:16px;overflow:hidden}
.st{flex:1 1 150px;padding:12px 16px;border-inline-end:1px solid var(--bd)}
.st:last-child{border-inline-end:0}
.st b{display:block;font-size:1.35rem;font-weight:600;line-height:1.5}
.st span{color:var(--mu);font-size:.85rem}
.st.now{background:var(--hl)}
.st.alert b{color:var(--red)}
.gcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.gc{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--card);border:1px solid var(--bd);border-inline-start:7px solid var(--bd);border-radius:6px;padding:16px 18px}
.gc:hover{border-color:var(--ac)}
.gc.done{border-inline-start-color:var(--ok)}.gc.wait{border-inline-start-color:var(--gold)}.gc.late{border-inline-start-color:var(--red)}
.gt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gt b{font-family:"Aref Ruqaa","Amiri",serif;font-size:1.5rem;font-weight:700;line-height:1.5}
.chip{font-style:normal;font-size:.78rem;font-weight:600;border:1px solid var(--bd);border-radius:4px;padding:0 8px;white-space:nowrap;color:var(--mu);margin-top:6px}
.done .chip{color:var(--ok);border-color:var(--ok)}.wait .chip{background:var(--hl);border-color:var(--gold);color:var(--tx)}.late .chip{color:var(--red);border-color:var(--red)}
.gm{color:var(--mu);font-size:.88rem}
.gw{font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--bd)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.gf{color:var(--mu);font-size:.82rem}
.gc.new{align-items:center;justify-content:center;min-height:150px;border:2px dashed var(--bd);color:var(--mu);font-weight:600}
.gc.new b{font-size:2rem;line-height:1;color:var(--ac)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.grid{min-width:560px}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:right}
.grid th:first-child,.grid td:first-child{position:sticky;right:0;background:var(--card)}
th small{display:block;font-weight:400;color:var(--mu)}
th.cur,td.cur{background:var(--acs)}
td.col{box-shadow:inset 0 -3px 0 var(--gold)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.tag{display:inline-block;background:var(--hl);border:1px solid var(--gold);border-radius:4px;padding:0 8px;font-size:.78rem;margin-inline-start:6px}
.empty{color:var(--mu);text-align:center;padding:18px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--red);font-weight:600}
a.wa{color:var(--ok);font-weight:600;text-decoration:none;border:1px solid var(--ok);border-radius:6px;padding:2px 10px}
#toast{position:fixed;bottom:18px;inset-inline:14px;max-width:460px;margin:auto;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:9}
</style>
</head>
<body>
<main><div id="app"><p class="empty">بيحمّل…</p></div></main>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== حط بيانات مشروعك من Supabase: Project Settings > API =====
const CFG={url:"https://vrmdgbdtrcvibkmhdxrc.supabase.co",key:"sb_publishable_Nx99uNC4fn3olLDw3Vf4dw_yTc8MIS8"};
// =================================================================
const qs=new URLSearchParams(location.search);
const view=qs.get("v");
const clean=x=>(x||"").replace(/[^\x21-\x7e]/g,"");
let K="";try{K=clean(localStorage.getItem("ac"))}catch(e){}
const RO=!!view;
const mk=k=>window.supabase.createClient(CFG.url,CFG.key,{global:{headers:{"x-edit-key":k||"none"}}});
let sb=mk(K);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString("ar-EG")+" جنيه";
let G=null,GL=[],MA=[],M=[],P=new Set();

function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4000)}
const ym=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const mLabel=i=>{const[y,m]=G.start_month.split("-");return new Date(+y,m-1+i,1).toLocaleDateString("ar-EG",{month:"short",year:"2-digit"})};
const dueDate=i=>{const[y,m]=G.start_month.split("-");return new Date(+y,m-1+i,G.due_day)};
const rawIdx=()=>{const[y,m]=G.start_month.split("-");const t=new Date();return (t.getFullYear()-y)*12+t.getMonth()-(m-1)};
const curIdx=()=>Math.max(0,Math.min(M.length-1,rawIdx()));
function late(mem){const k=Math.min(rawIdx(),M.length-1);let cnt=0,worst=0,first=-1;
  for(let i=0;i<=k;i++)if(!P.has(mem.id+":"+i)){const d=Math.floor((Date.now()-dueDate(i))/864e5);if(d>0){cnt++;worst=Math.max(worst,d);if(first<0)first=i}}
  return{cnt,worst,first}}
function waLink(mem,first){let n=(mem.phone||"").replace(/\D/g,"");if(n.startsWith("0"))n="20"+n.slice(1);
  const t=`السلام عليكم ${mem.name}، تذكير بقسط جمعية "${G.name}" لشهر ${mLabel(first)} (${money(G.amount)}). جزاك الله خيرًا.`;
  return "https://wa.me/"+n+"?text="+encodeURIComponent(t)}

async function init(){
  if(RO){const{data,error}=await sb.rpc("get_shared",{t:view});
    if(error||!data){$("app").innerHTML='<p class="empty">الرابط ده مش شغال أو اتغيّر.</p>';return}
    G=data.gameya;M=data.members;P=new Set(data.payments.map(x=>x.member_id+":"+x.month_idx));draw();return}
  loadList()}
async function loadAll(sel){
  const[g,m,p]=await Promise.all([sb.from("gameyas").select("*").order("created_at"),sb.from("members").select("*").order("position"),sb.from("payments").select("member_id,month_idx")]);
  const er=g.error||m.error||p.error;if(er)return toast("تعذر تحميل البيانات: "+er.message);
  GL=g.data;MA=m.data;P=new Set(p.data.map(x=>x.member_id+":"+x.month_idx));
  const id=sel===undefined?G?.id:sel;G=GL.find(x=>x.id===id)||null;pick();draw()}
const pick=()=>{M=G?MA.filter(x=>x.gameya_id===G.id):[]};
const loadList=loadAll,loadG=()=>loadAll();
const hero=(t,sub,b)=>`<header class="hero"><div class="hin">${b||""}<h1>${esc(t)}</h1>${sub?`<p>${sub}</p>`:""}</div></header>`;
function info(g){const sg=G,sm=M;G=g;M=MA.filter(x=>x.gameya_id===g.id);
  const r={n:M.length,paid:0,late:0,who:"",mo:"",flags:[]};
  if(M.length){const c=curIdx();r.who=M[c].name;r.mo=mLabel(c);M.forEach(m=>{const on=P.has(m.id+":"+c);r.flags.push(on);if(on)r.paid++;if(late(m).cnt)r.late++})}
  G=sg;M=sm;return r}
function home(){
  const I=GL.map(g=>({g,i:info(g)}));
  const sum=f=>I.reduce((a,x)=>a+f(x),0);
  let h=`<section class="stats ov"><div class="st"><b>${GL.length}</b><span>جمعيات شغالة</span></div>
    <div class="st"><b>${sum(x=>x.i.n)}</b><span>إجمالي الأعضاء</span></div>
    <div class="st"><b>${money(sum(x=>x.i.n*(+x.g.amount||0)))}</b><span>مجموع القبض الشهري</span></div>
    <div class="st ${sum(x=>x.i.late)?"alert":""}"><b>${sum(x=>x.i.late)}</b><span>أعضاء متأخرين</span></div></section><div class="gcs">`;
  h+=I.map(({g,i})=>{
    const st=!i.n?"idle":i.late?"late":i.paid<i.n?"wait":"done";
    const tx={idle:"لسه فاضية",late:i.late+" متأخر",wait:"في انتظار الدفع",done:"الكل دفع"}[st];
    return`<button class="gc ${st}" data-a="open" data-id="${g.id}"><span class="gt"><b>${esc(g.name)}</b><em class="chip">${tx}</em></span>
      <span class="gm">${i.n} أعضاء، القسط ${money(g.amount)} شهريًا</span>
      <span class="gw">${i.n?`الدور على ${esc(i.who)} في ${i.mo}`:"أضف الأعضاء للبدء"}</span>
      <span class="dots" aria-hidden="true">${i.flags.map(f=>`<i class="${f?"on":""}"></i>`).join("")}</span>
      <span class="gf">${i.n?`${i.paid} من ${i.n} دفعوا الشهر ده`:""}</span></button>`}).join("");
  h+=`<button class="gc new" data-a="newg"><b>+</b><span>جمعية جديدة</span></button></div>`;
  $("app").innerHTML=hero("جمعياتي","")+'<div class="ct">'+h+'</div>';bind()}

function draw(){
  if(!RO&&!G)return home();
  const n=M.length,amt=+G.amount||0;
  const top=hero(G.name,(RO?"عرض فقط: ":"")+(n?`${n} أعضاء، والقسط ${money(amt)} شهريًا`:"لسه مفيش أعضاء"),RO?"":'<button class="hb" data-a="home">كل الجمعيات</button>');
  let h="";
  if(!RO)h+=`<section class="card"><h2>بيانات الجمعية</h2><div class="row">
    <label>الاسم<input id="gn" value="${esc(G.name)}"></label>
    <label>القسط الشهري<input id="ga" type="number" min="0" value="${amt}"></label>
    <label>شهر البداية<input id="gs" type="month" value="${G.start_month}"></label>
    <label>يوم الاستحقاق (١-٢٨)<input id="gd" type="number" min="1" max="28" value="${G.due_day}"></label></div></section>`;
  if(!n){h+=RO?'<p class="empty">مفيش أعضاء لسه.</p>':""}
  else{
    const cur=curIdx();let pn=0,tp=0;M.forEach(x=>{if(P.has(x.id+":"+cur))pn++;for(let k=0;k<n;k++)if(P.has(x.id+":"+k))tp+=amt});
    h+=`<div class="stats">
    <div class="st"><b>${money(amt*n)}</b><span>قيمة القبض الشهري</span></div>
    <div class="st now"><b>${esc(M[cur].name)}</b><span>عليه الدور في ${mLabel(cur)}</span></div>
    <div class="st"><b>${pn} / ${n}</b><span>دفعوا الشهر ده</span></div>
    <div class="st"><b class="${pn<n?"bad":"ok"}">${money((n-pn)*amt)}</b><span>متبقي تحصيله</span></div>
    <div class="st"><b>${money(tp)}</b><span>إجمالي المدفوع</span></div></div>`;
    const lt=M.map(m=>({m,l:late(m)})).filter(x=>x.l.cnt);
    h+=`<section class="card"><h2>المتأخرين</h2>`+(lt.length?`<table>`+lt.map(({m,l})=>`<tr><td>${esc(m.name)}</td>
      <td class="bad">متأخر ${l.cnt} شهر، أقدمهم ${l.worst} يوم</td>`+(RO?"":`<td>${m.phone?`<a class="wa" target="_blank" rel="noopener" href="${waLink(m,l.first)}">تذكير واتساب</a>`:`<button class="g" data-a="ph" data-i="${M.indexOf(m)}">ضيف رقم</button>`}</td>`)+`</tr>`).join("")+`</table>`:'<p class="empty ok">محدش متأخر.</p>')+`</section>`}
  if(!RO)h+=`<section class="card"><h2>الأعضاء (بترتيب الدور)</h2><div class="row">
    <label>اسم العضو<input id="mn" placeholder="اكتب الاسم واضغط إضافة"></label><button class="p" data-a="add">إضافة</button><button data-a="shuf">قرعة</button></div>
    ${n?`<table style="margin-top:10px">`+M.map((m,i)=>`<tr><td>${i+1}. ${esc(m.name)}${m.received_at?`<span class="tag">استلم ${m.received_at}</span>`:""}</td>
    <td style="text-align:left"><button class="g" data-a="rcv" data-i="${i}">${m.received_at?"إلغاء الاستلام":"استلم"}</button>
    <button class="g" data-a="ph" data-i="${i}">${m.phone?"تعديل الرقم":"رقم"}</button>
    <button class="g" data-a="up" data-i="${i}" aria-label="لفوق">▲</button><button class="g" data-a="dn" data-i="${i}" aria-label="لتحت">▼</button>
    <button class="g d" data-a="del" data-i="${i}">حذف</button></td></tr>`).join("")+`</table>`:'<p class="empty">أضف أول عضو.</p>'}</section>`;
  if(n){const cur=curIdx();
    h+=`<section class="card"><h2>متابعة الدفع</h2><div class="wrap"><table class="grid"><thead><tr><th>العضو</th>`+
    M.map((m,i)=>`<th class="${i===cur?"cur":""}">${mLabel(i)}<small>${esc(m.name)}</small></th>`).join("")+`<th>المدفوع</th></tr></thead><tbody>`+
    M.map((m,r)=>{let c=0;return`<tr><td>${esc(m.name)}</td>`+M.map((_,i)=>{const on=P.has(m.id+":"+i);if(on)c++;
      return`<td class="${i===cur?"cur ":""}${i===r?"col":""}"><input type="checkbox" data-p="${m.id}:${i}"${on?" checked":""}${RO?" disabled":""} aria-label="${esc(m.name)} ${mLabel(i)}"></td>`}).join("")+`<td>${c} / ${n}</td></tr>`}).join("")+`</tbody></table></div></section>`}
  if(!RO)h+=`<div class="row"><button data-a="share">نسخ رابط المشاهدة</button><button data-a="exp">تصدير نسخة JSON</button><button class="d" data-a="delg">حذف الجمعية</button></div>`;
  $("app").innerHTML=top+'<div class="ct">'+h+'</div>';bind()}

function bind(){
  if(RO)return;
  const s=$("sel");if(s)s.onchange=()=>{G=GL.find(x=>x.id===s.value);loadG()};
  ["gn","ga","gs","gd"].forEach(id=>{const e=$(id);if(e)e.onchange=saveSet});
  const mn=$("mn");if(mn)mn.onkeydown=e=>{if(e.key==="Enter")act("add")}}
async function saveSet(){
  const u={name:$("gn").value.trim()||G.name,amount:+$("ga").value||0,start_month:$("gs").value||G.start_month,due_day:Math.min(28,Math.max(1,+$("gd").value||1))};
  const{error}=await sb.from("gameyas").update(u).eq("id",G.id);if(error)return toast(error.message);Object.assign(G,u);draw()}
async function run(q){const{error}=await q;if(error)toast(error.message);return!error}
async function act(a,i,b){const m=M[i];
  if(a==="open"){G=GL.find(x=>x.id===b.dataset.id)||null;pick();window.scrollTo(0,0);return draw()}
  if(a==="home"){G=null;pick();window.scrollTo(0,0);return draw()}
  if(a==="out"){try{localStorage.removeItem("ac")}catch(e){}return location.reload()}
  if(a==="newg"){const name=prompt("اسم الجمعية؟");if(!name)return;
    const{data,error}=await sb.from("gameyas").insert({name,start_month:ym()}).select().single();if(error)return toast(error.message);return loadList(data.id)}
  if(a==="add"){const v=$("mn").value.trim();if(!v)return;
    if(await run(sb.from("members").insert({gameya_id:G.id,name:v,position:n1()})))loadG();return}
  if(a==="shuf"){if(M.length<2||!confirm("هيتغير ترتيب الدور عشوائيًا. نكمل؟"))return;
    const o=[...M].sort(()=>Math.random()-.5);await Promise.all(o.map((x,k)=>sb.from("members").update({position:k}).eq("id",x.id)));return loadG()}
  if(a==="up"||a==="dn"){const b=M[i+(a==="up"?-1:1)];if(!b)return;
    await Promise.all([sb.from("members").update({position:b.position}).eq("id",m.id),sb.from("members").update({position:m.position}).eq("id",b.id)]);return loadG()}
  if(a==="del"){if(confirm("حذف "+m.name+" وكل مدفوعاته؟")&&await run(sb.from("members").delete().eq("id",m.id)))loadG();return}
  if(a==="rcv"){if(await run(sb.from("members").update({received_at:m.received_at?null:new Date().toISOString().slice(0,10)}).eq("id",m.id)))loadG();return}
  if(a==="ph"){const p=prompt("رقم تليفون "+m.name,m.phone||"");if(p===null)return;if(await run(sb.from("members").update({phone:p.trim()||null}).eq("id",m.id)))loadG();return}
  if(a==="share"){const l=location.origin+location.pathname+"?v="+G.share_token;
    try{await navigator.clipboard.writeText(l);toast("اتنسخ الرابط. أي حد معاه الرابط يقدر يشوف الجدول بس.")}catch(e){prompt("انسخ الرابط:",l)}return}
  if(a==="exp"){const b=new Blob([JSON.stringify({gameya:G,members:M,payments:[...P]},null,2)],{type:"application/json"});
    const x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="gameya-"+ym()+".json";x.click();return}
  if(a==="delg"){if(confirm("حذف الجمعية «"+G.name+"» نهائيًا؟")&&await run(sb.from("gameyas").delete().eq("id",G.id))){G=null;loadList()}}}
const n1=()=>M.length?Math.max(...M.map(x=>x.position))+1:0;
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,+b.dataset.i,b)});
document.addEventListener("change",async e=>{const c=e.target;if(RO||!c.dataset||!c.dataset.p)return;
  const[id,i]=c.dataset.p.split(":");
  const ok=await run(c.checked?sb.from("payments").insert({member_id:id,month_idx:+i}):sb.from("payments").delete().eq("member_id",id).eq("month_idx",+i));
  if(!ok)return loadG();c.checked?P.add(id+":"+i):P.delete(id+":"+i);draw()});
init();
</script>
</body>
</html>
